apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply from: '../signing.gradle'

// The Wear OS app: a bed-control screen (Compose for Wear OS), a tile (your side's temperature, Hot flash, on/off) and a watch-face complication. Same application id as the phone app,
// which Wear's phone-to-watch data link requires; the phone hands it the server address and sign-in.
android {
    namespace = "app.embertide.wear"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.embertide"
        minSdkVersion 30
        targetSdkVersion 36
        versionCode embertideVersionCode
        versionName embertideVersionName
    }
    // Same signing key as the phone app: the data link only pairs apps signed with the same certificate.
    signingConfigs {
        release {
            def ks = embertideSigning()
            if (ks != null) {
                storeFile ks.storeFile
                storePassword ks.storePassword
                keyAlias ks.keyAlias
                keyPassword ks.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true             // Compose is large; R8 trims the watch app to a few MB
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            if (embertideSigning() != null) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle("Ember & Tide: no release keystore given, so the watch release build is UNSIGNED.")
            }
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin { jvmToolchain(21) }

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.10.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.wear.compose:compose-material3:1.5.3"
    implementation "androidx.wear.compose:compose-foundation:1.5.3"
    implementation "androidx.activity:activity-compose:1.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    implementation "androidx.wear.tiles:tiles:1.6.2"
    implementation "androidx.wear.protolayout:protolayout:1.4.2"
    implementation "androidx.wear.protolayout:protolayout-expression:1.4.2"
    implementation "com.google.android.gms:play-services-wearable:20.0.1"
    implementation "androidx.health:health-services-client:1.1.0"     // passive heart rate at night
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"
}
