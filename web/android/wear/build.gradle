apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// The Wear OS app: a tile (your side's temperature, Hot flash, on/off) and a watch-face complication. Same application id as the phone app,
// which Wear's phone-to-watch data link requires; the phone hands it the server address and sign-in.
android {
    namespace = "app.embertide.wear"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.embertide"
        minSdkVersion 30
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin { jvmToolchain(21) }

dependencies {
    implementation "androidx.wear.tiles:tiles:1.6.2"
    implementation "androidx.wear.protolayout:protolayout:1.4.2"
    implementation "androidx.wear.protolayout:protolayout-expression:1.4.2"
    implementation "com.google.android.gms:play-services-wearable:20.0.1"
    implementation "androidx.health:health-services-client:1.1.0"     // passive heart rate at night
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"
}
