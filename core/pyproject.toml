[project]
name = "embertide"
version = "0.1.0"
description = "Ember & Tide: a local-first controller for dual-zone smart mattress toppers (Orion first)"
license = { text = "MIT" }
authors = [{ name = "Ncbudd" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "aiomqtt>=2.3",
  "httpx>=0.27",
  "tzdata>=2024.1",
  "websockets>=13",
  "cryptography>=43",            # Web Push message encryption (RFC 8291) for app notifications
  "icalendar>=6",                # calendar feeds (Fastmail, iCloud, Google): evening events, early starts
  "recurring-ical-events>=3",
  "pywebpush>=2.0",              # Web Push (VAPID) for the iPhone / browser web app
]

[project.optional-dependencies]
claude = ["anthropic>=1"]                                    # ET_LLM_PROVIDER=anthropic
dev = ["pytest>=8", "pytest-asyncio>=0.23", "amqtt>=0.11"]   # amqtt: a throwaway broker for the live MQTT test

[project.scripts]
embertide = "embertide.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embertide"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
