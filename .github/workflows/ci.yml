name: CI

# Plain pull_request trigger: runs with a read-only token and no secrets, so it is safe for fork PRs.
# The test and build logic lives in the shared, SHA-pinned workflows of Ncbudd/ncbudd-pipeline.

on:
  push:
    branches: [main, master]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    uses: Ncbudd/ncbudd-pipeline/.github/workflows/ci-python.yml@v1
    permissions:
      contents: read
    with:
      working-directory: core
      # The suite is long (about half an hour end to end), so it runs as four parallel shards.
      shards: "[0,1,2,3]"
      # tests that need private real-world data skip themselves when it is absent

  web:
    uses: Ncbudd/ncbudd-pipeline/.github/workflows/ci-node.yml@v1
    permissions:
      contents: read
    with:
      working-directory: web
      commands: |
        npm ci
        npx tsc --noEmit -p .
        npm run build

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t ember-tide:ci .
      # same gate as the release scan, so a fixable HIGH/CRITICAL in the image shows up on the pull request, not at release
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ember-tide:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The Android app: the no-Google ("minimal") flavor, so CI never needs a Firebase file or a signing key.
  # Release builds, signing and the Google push flavor are in release.yml.
  android:
    uses: Ncbudd/ncbudd-pipeline/.github/workflows/ci-android.yml@v1
    permissions:
      contents: read
    with:
      working-directory: web/android
      gradle-tasks: testMinimalDebugUnitTest assembleMinimalDebug
      node-version: "22"
      node-lockfile: web/package-lock.json
      prepare-command: |
        cd web
        npm ci
        npm run build
        npx cap sync android
