name: Release

# Runs when a version tag (v0.1.0, v1.2.3, ...) is pushed, or by hand from the Actions tab with a version.
# Produces: the server image on ghcr.io (amd64 + arm64), the signed Android APKs (Google push and no-Google), the
# signed Wear OS APK, SHA256SUMS.txt, and a GitHub Release with all of them. Setup and secrets: docs/PUBLISHING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.1.0). The CHANGELOG should have a section for it."
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- (a) version, tests and web build ----------
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
      major_minor: ${{ steps.v.outputs.major_minor }}
    steps:
      - name: Work out the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"; elif [ "$IS_TAG" = "true" ]; then v="$REF_NAME"; else echo "Run this from a v* tag or give a version."; exit 1; fi
          v="${v#v}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Version must look like 1.2.3 (got '$v')."; exit 1; fi
          major="${v%%.*}"; rest="${v#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
          # versionCode only ever goes up: major*10000 + minor*100 + patch (0.1.0 -> 100, 0.2.3 -> 203, 1.0.0 -> 10000).
          # Keep minor and patch under 100. Android refuses to install an APK with a lower versionCode over a higher one.
          if [ "$minor" -ge 100 ] || [ "$patch" -ge 100 ]; then echo "minor and patch must stay below 100 for the versionCode scheme."; exit 1; fi
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major.$minor" >> "$GITHUB_OUTPUT"
          echo "Releasing $v (versionCode $code)"

  core-tests:
    needs: version
    uses: Ncbudd/ncbudd-pipeline/.github/workflows/ci-python.yml@v1
    permissions:
      contents: read
    with:
      working-directory: core
      shards: "[0,1,2,3]"

  web:
    needs: version
    uses: Ncbudd/ncbudd-pipeline/.github/workflows/ci-node.yml@v1
    permissions:
      contents: read
    with:
      working-directory: web
      commands: |
        npm ci
        npx tsc --noEmit -p .
        npm run build

  # ---------- (b) server image ----------
  # Scan, then the publish step waits in the `production` environment for one approval (a tap in the GitHub mobile
  # app, once you are listed as a required reviewer there). Then multi-arch build, push, cosign signature, SBOM and
  # provenance attestations. See the ncbudd-pipeline README.
  image:
    needs: [version, core-tests, web]
    uses: Ncbudd/ncbudd-pipeline/.github/workflows/release-image.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image: ghcr.io/ncbudd/ember-tide
      tags: |
        ghcr.io/ncbudd/ember-tide:${{ needs.version.outputs.version }}
        ghcr.io/ncbudd/ember-tide:${{ needs.version.outputs.major_minor }}
        ghcr.io/ncbudd/ember-tide:latest
      labels: |
        org.opencontainers.image.title=Ember & Tide
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
        org.opencontainers.image.version=${{ needs.version.outputs.version }}
      environment: production

  # ---------- (c) Android apps ----------
  android:
    needs: [version, core-tests, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EMBERTIDE_VERSION: ${{ needs.version.outputs.version }}
      EMBERTIDE_VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # release builds never reuse a cache
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Web build and Capacitor sync
        working-directory: web
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Decode the signing key and the Firebase config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set. Release APKs must be signed (see docs/PUBLISHING.md)."
            exit 1
          fi
          ks="$RUNNER_TEMP/embertide-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          echo "ANDROID_KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_B64" | base64 -d > web/android/app/google-services.json
            echo "HAVE_GOOGLE_SERVICES=1" >> "$GITHUB_ENV"
          else
            echo "::warning::GOOGLE_SERVICES_JSON_B64 is not set, so the Google push APK is skipped. The no-Google APK and the watch APK are still built."
          fi
      - name: Build the APKs
        working-directory: web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          tasks="testMinimalDebugUnitTest assembleMinimalRelease :wear:assembleRelease"
          if [ "$HAVE_GOOGLE_SERVICES" = "1" ]; then tasks="testFullDebugUnitTest assembleFullRelease $tasks"; fi
          ./gradlew $tasks --no-daemon --stacktrace
      - name: Name the files
        run: |
          set -e
          v="$EMBERTIDE_VERSION"
          out=release-files
          mkdir -p "$out"
          cp web/android/app/build/outputs/apk/minimal/release/app-minimal-release.apk "$out/ember-tide-$v-android-no-google.apk"
          cp web/android/wear/build/outputs/apk/release/wear-release.apk "$out/ember-tide-$v-wear-os.apk"
          if [ "$HAVE_GOOGLE_SERVICES" = "1" ]; then
            cp web/android/app/build/outputs/apk/full/release/app-full-release.apk "$out/ember-tide-$v-android-google-push.apk"
          fi
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: release-files/*.apk
          if-no-files-found: error
      - name: Delete the decoded signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/embertide-release.jks" web/android/app/google-services.json

  # ---------- (d) the GitHub Release ----------
  release:
    needs: [version, image, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: release-files
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          (cd release-files && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Notes: the CHANGELOG section for this version ("## 0.1.0 ..." up to the next "## " heading).
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md for what changed in $VERSION." > notes.md; fi
          {
            echo
            echo "### Downloads"
            echo "- \`ember-tide-$VERSION-android-google-push.apk\`: the Android app with Google push (recommended for most phones)."
            echo "- \`ember-tide-$VERSION-android-no-google.apk\`: the Android app with no Google services (ntfy / UnifiedPush or Web Push)."
            echo "- \`ember-tide-$VERSION-wear-os.apk\`: the Wear OS tile and heart-rate app."
            echo "- Server: \`docker pull ghcr.io/ncbudd/ember-tide:$VERSION\` (see docs/install.md)."
            echo "- \`SHA256SUMS.txt\`: check a download with \`sha256sum -c SHA256SUMS.txt\`."
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          tag="v$VERSION"
          gh release create "$tag" release-files/*.apk release-files/SHA256SUMS.txt \
            --repo "$REPO" --target "$GITHUB_SHA" --title "Ember & Tide $VERSION" --notes-file notes.md
