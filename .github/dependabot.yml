version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /core
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Major bumps (React 19, router 7, TypeScript 7, Vite 8, Gradle 9, odd-numbered Node) are migrations, not updates: do them by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"

  - package-ecosystem: gradle
    directory: /web/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Major bumps (React 19, router 7, TypeScript 7, Vite 8, Gradle 9, odd-numbered Node) are migrations, not updates: do them by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      gradle:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Major bumps (React 19, router 7, TypeScript 7, Vite 8, Gradle 9, odd-numbered Node) are migrations, not updates: do them by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
