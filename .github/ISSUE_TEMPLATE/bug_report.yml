name: Bug report
description: Something doesn't work the way it should
labels: ["bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please remove passwords, tokens, serial numbers, real addresses and domains from anything you paste.
        For a security problem, don't use this form; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order. If the simulator shows it too (Studio, Simulator), say so.
  - type: input
    id: version
    attributes:
      label: Version
      description: Studio → Help shows the version (so does /healthz on your server), or say which commit or release you built.
    validations:
      required: true
  - type: dropdown
    id: bed
    attributes:
      label: Bed driver
      options: [Simulator (sim), Orion cloud (orion-cloud), Orion local MQTT (orion-mqtt), Home Assistant climate (ha-climate), Sleepme Dock Pro (sleepme), Eight Sleep free-sleep (free-sleep), Not sure]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options: [Docker (Compose, NAS or Portainer), Bare metal (no Docker), From source (development), Other]
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone or watch, and app version
      description: "Android or iPhone (web app) and its OS version, the app version from the release you installed, or the browser. Leave blank if it happens on a computer."
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: "`docker compose logs embertide` (Docker), `journalctl -u embertide` (bare metal), `mosquitto` for connection problems. Remove API keys, passwords, tokens, serial numbers, addresses and domains first."
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A screenshot (use the simulator or blur names).
  - type: dropdown
    id: ai
    attributes:
      label: Did you use an AI tool to write this?
      description: Fine either way; it helps us read it right. See CONTRIBUTING.md, "Using AI tools".
      options: ["No", "Yes (tool and model below)"]
    validations:
      required: true
  - type: input
    id: ai_model
    attributes:
      label: AI tool and model, and what it did
      description: "For example: ChatGPT (GPT-5) summarised my logs; Claude (Opus 5.5) tidied the wording. Leave blank if you answered No."
