name: Bug report
description: Something doesn't work the way it should
labels: ["bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please remove passwords, tokens, serial numbers, real addresses and domains from anything you paste.
        For a security problem, don't use this form; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order. If the simulator shows it too (Studio, Simulator), say so.
  - type: input
    id: version
    attributes:
      label: Version
      description: Studio → Help shows the version (so does /healthz on your server), or say which commit or release you built.
    validations:
      required: true
  - type: dropdown
    id: bed
    attributes:
      label: Bed driver
      options: [Simulator (sim), Orion cloud (orion-cloud), Orion local MQTT (orion-mqtt), Not sure]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options: [Docker (Compose, NAS or Portainer), Bare metal (no Docker), From source (development), Other]
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone or watch, and app version
      description: "Android or iPhone (web app) and its OS version, the app version from the release you installed, or the browser. Leave blank if it happens on a computer."
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: "`docker compose logs embertide` (Docker), `journalctl -u embertide` (bare metal), `mosquitto` for connection problems. Remove API keys, passwords, tokens, serial numbers, addresses and domains first."
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A screenshot (use the simulator or blur names).
