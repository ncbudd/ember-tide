# Mosquitto configuration for Ember & Tide (mounted at /mosquitto/config/mosquitto.conf).
#
# The Orion topper's local protocol is plain MQTT with no username or password on the bed's side, so this
# broker has ONE job: carry orion/<serial>/in and orion/<serial>/out between the bed and Ember & Tide.
# Keep it on your home network. Never forward port 1883 on your router.

# Listener for the bed (and for Ember & Tide, which sits next to it in the same Compose project).
listener 1883 0.0.0.0
allow_anonymous true

# Anonymous clients may only touch the bed's two topics (see acl). Nothing else is reachable without a
# login, and nothing else is needed.
acl_file /mosquitto/config/acl

# Log to the container's output so `docker compose logs mosquitto` shows when the bed connects.
log_dest stdout
log_type error
log_type warning
log_type notice
# Uncomment to see every connect and subscribe while you set the bed up (noisy):
# connection_messages true
# log_type subscribe

# The bed re-announces itself after any restart, so nothing needs to survive one. Keeping persistence off
# avoids writing to the disk all night.
persistence false

# Optional: a second, password-protected listener for your own tools (Home Assistant, a laptop).
# Create the file with:
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd homeassistant
# then uncomment the volume line for it in docker-compose.yml.
# listener 1884 0.0.0.0
# allow_anonymous false
# password_file /mosquitto/config/passwd
